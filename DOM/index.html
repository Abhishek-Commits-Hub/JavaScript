<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM - Learning</title>
</head>

<body style="background-color: #212121; color: #fff;">
  <ul class="language">
    <li>JavaScript</li>
  </ul>
</body>

<script>
  function addLanguage(langName) {
    const li = document.createElement('li');
    li.innerText = `${langName}`;
    document.querySelector('.language').appendChild(li);
  }
  // addLanguage("Java");
  // addLanguage("Python");
  // addLanguage("C++");

  function addOptiLanguage(langName) {
    const li = document.createElement('li');
    li.appendChild(document.createTextNode(langName));
    document.querySelector('.language').appendChild(li);
  }

  addOptiLanguage("Java");
  addOptiLanguage("Python");
  addOptiLanguage("C++");

  //Edit

  const thirdLang = document.querySelector('li:nth-child(3)');
  thirdLang.innerHTML = 'Ruby';

  const secLang = document.querySelector('li:nth-child(2)');
  const myLi = document.createElement('li');
  myLi.textContent = "GoLang";
  secLang.replaceWith(myLi);

  const firstLanguage = document.querySelector('li:first-child');
  firstLanguage.outerHTML = '<li>TypeScript</li>';

  //Remove

  const lastLang = document.querySelector('li:last-child');
  lastLang.remove();
</script>

</html>
